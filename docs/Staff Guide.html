<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍩 던킨 알바생을 위한 쉬운 설명서</title>
    <style>
        :root {
            --main-pink: #e0638c;
            --sub-orange: #fca311;
            --bg-light: #fffcf9;
            --text-color: #444;
        }
        body {
            font-family: 'Nanum Gothic', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-color);
            line-height: 1.8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 5px solid var(--sub-orange);
        }
        .header {
            text-align: center;
            background: linear-gradient(to right, var(--main-pink), var(--sub-orange));
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin-top: 10px; font-size: 16px; }

        h2 {
            color: #e67e22;
            font-size: 20px;
            border-left: 6px solid var(--sub-orange);
            padding-left: 10px;
            margin-top: 30px;
        }
        .card {
            background: #fffaf5;
            border: 2px solid #ffe4cc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .step {
            display: flex;
            margin-bottom: 15px;
            align-items: center;
        }
        .number {
            background: var(--sub-orange);
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .benefit {
            background-color: #f0fff4;
            border: 1px solid #c6f6d5;
            padding: 15px;
            border-radius: 12px;
            color: #2f855a;
            font-weight: bold;
            margin-top: 15px;
        }
        .penalty {
            background-color: #fff5f5;
            border: 2px solid #ffcccc;
            padding: 15px;
            border-radius: 12px;
            color: #c53030;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
        footer { text-align: center; margin-top: 40px; color: #bbb; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🍩 던킨 알바생 가이드</h1>
        <p>버튼을 잘 눌러야 내 월급이 지켜져요!</p>
    </div>

    <section>
        <h2>1
